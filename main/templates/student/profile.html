{% extends "base.html" %}

{% block title %} My Profile {% endblock %}

{% block content %}
<div class="container-fluid mt-5 px-4">
    <div class="row">
        <div class="col-md-3 mb-4">
            <div class="card shadow-sm border-0 sticky-top" style="top: 20px;">
                <div class="card-body p-0 border rounded-3">

                    <!-- Navigation Menu Using Anchors -->
                    <div class="list-group list-group-flush rounded-3">
                        <a href="#general" class="list-group-item list-group-item-action py-3">
                            <i class="bi bi-person me-2"></i> General Info
                        </a>
                        <a href="#academic" class="list-group-item list-group-item-action py-3">
                            <i class="bi bi-book me-2"></i> Academic Details
                        </a>
                        <a href="#links" class="list-group-item list-group-item-action py-3">
                            <i class="bi bi-link-45deg me-2"></i> Professional Links
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-9">
            <form method="POST" action="{{ url_for('student.profile') }}" class="card shadow-sm border-0 p-4" enctype="multipart/form-data">
                <div id="general" class="mb-5">

                    <!-- Genreal Anchor -->
                    <h4 class="fw-bold mb-3 border-bottom pb-2">General Information</h4>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">First Name</label>
                            <input type="text" name="fname" class="form-control" value="{{ student.fname }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Last Name</label>
                            <input type="text" name="lname" class="form-control" value="{{ student.lname }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Contact Number</label>
                            <input type="text" name="phone" class="form-control" value="{{ student.phone }}" placeholder="e.g. +91 XXXXX XXXXX" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email Address</label>
                            <input type="text" name="email" value="{{ student.email }}" class="form-control" required>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">Bio</label>
                            <textarea name="bio" class="form-control" rows="3">{{ student.bio }}</textarea>
                        </div>
                    </div>
                </div>

                <!-- Academic Records Anchor -->
                <div id="academic" class="mb-5">
                    <h4 class="fw-bold mb-3 border-bottom pb-2">Academic Records</h4>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Roll Number</label>
                            <input type="text" class="form-control bg-light" value="{{ student.roll }}" readonly>
                            <small class="text-muted">Contact Admin to change Roll No.</small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">CGPA</label>
                            <input type="number" step="0.01" name="cgpa" class="form-control" value="{{ student.cgpa }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Expected Year of Graduation</label>
                            <input type="number" name="graduation" value="{{ student.graduation_year }}" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Batch</label>
                            <input type="text" name="batch" class="form-control" value="{{ student.batch }}" placeholder="Year - Term" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Degree Field</label>
                            <input type="text" name="degree" value="{{ student.degree_field }}" class="form-control" placeholder="BS in Data Science" required>
                        </div>
                    </div>
                </div>

                <!-- Professional Anchor -->
                <div id="links">
                    <h4 class="fw-bold mb-3 border-bottom pb-2">Professional Presence</h4>
                    <div class="mb-3">
                        <label class="form-label">Skills (Comma Separated)</label>
                        <input type="text" name="skills" class="form-control" value="{{ student.skills }}" placeholder="Python, SQL, Flask...">
                    </div>
                    
                    <!-- Resume -->                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Resume URL (Drive/Link)</label>
                            <input type="url" name="resume_url" class="form-control" value="{{ student.resume }}" placeholder="https://drive.google.com/...">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Upload PDF Resume</label>
                            <input type="file" name="resume_file" class="form-control" accept=".pdf">
                        </div>
                    </div>

                    <div>
                        <label class="form-label">Github (Optional)</label>
                        <input type="url" name="github" value="{{ student.github }}" class="form-control" placeholder="https://...">
                    </div>
                    <div>
                        <label class="form-label">Linkedin (Optional)</label>
                        <input type="url" name="linkedin" value="{{ student.linkedin }}" class="form-control" placeholder="https://...">
                    </div>
                    <div>
                        <label class="form-label">Portfolio Site (Optional)</label>
                        <input type="url" name="portfolio" value="{{ student.portfolio }}" class="form-control" placeholder="https://...">
                    </div>
                </div>

                <!-- Save Button -->
                <div class="text-end border-top pt-3">
                    <button type="submit" class="btn btn-primary btn-lg px-5">Save Profile</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
