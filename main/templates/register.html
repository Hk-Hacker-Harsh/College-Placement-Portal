{% extends "base.html" %}

{% block title %} Registration - Portal {% endblock %}

{% block content %}
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card shadow-lg border-0 mt-5" style="width: 100%; max-width: 450px; border-radius: 15px;">
            <div class="card-body p-5">
                <h2 class="text-center fw-bold mb-4">Create Account</h2>
                <p class="text-center text-muted mb-4" style="background-color: #8ab6fc;">Join the IITM Placement Portal</p>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-uppercase">Register as:</label>
                        <select name="role" id="role" class="form-select form-select-lg" style="font-size: medium;" required>
                            <option value="student" style="font-size: medium;">Student</option>
                            <option value="company" style="font-size: medium;">Company</option>
                        </select>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="user" name="user" placeholder="Username" pattern="^[a-zA-Z0-9_]+$" title="Letters, numbers, and underscores only." required>
                        <label for="user">Username</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="password" class="form-control" id="pass" name="pass" minlength="6" placeholder="Password" required>
                        <label for="pass">Password</label>
                    </div>

                    <div class="form-floating mb-4">
                        <input type="password" class="form-control" id="con-pass" name="con-pass" minlength="6" placeholder="Confirm Password" required>
                        <label for="con-pass">Confirm Password</label>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm" style="border-radius: 10px;">
                        Sign Up
                    </button>
                </form>

                <div class="text-center mt-4">
                    <p class="small text-muted">Already have an account? <a href="{{ url_for('auth.login') }}" class="text-decoration-none">Login here</a></p>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
