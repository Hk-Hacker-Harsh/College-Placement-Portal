{% extends "base.html" %}

{% block title %} New Drive {% endblock %}

<!-- Add Drive Form -->
{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0 p-4">
                <h3 class="fw-bold mb-4">Post New Job Drive</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Job Title</label>
                        <input type="text" name="title" class="form-control" placeholder="e.g. Data Analyst" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Package (LPA)</label>
                            <input type="number" step="0.1" name="package" class="form-control" placeholder="7.5" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Deadline</label>
                            <input type="date" name="deadline" class="form-control" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Description</label>
                        <textarea name="description" class="form-control" rows="4" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Requirements / Skills</label>
                        <textarea name="requirements" class="form-control" rows="3" placeholder="Comma separated skills..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Submit for Approval</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
